[project]
name = "coding-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai>=2.18.0",
    "prompt-toolkit>=3.0",
    "python-dotenv>=1.0",
    "questionary>=2.1",
    "rich>=13.0",
    "typer",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# 只对图片输入这一层设覆盖率门禁（行 90%）；分支 85% 由
# scripts/check_image_coverage.py 精确校验，legacy 模块不设全局 fail-under
[tool.coverage.run]
branch = true
source = ["images"]

[tool.coverage.report]
show_missing = true

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
