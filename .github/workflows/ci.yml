name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync
      - name: Lint
        run: uvx ruff check .
      - name: Offline functional tests (unit, workflow, agent, provider e2e, CLI PTY e2e)
        run: uv run pytest -q
      - name: Image coverage gate
        # 行覆盖率 90% 由 coverage 自己判定；分支 85% 由脚本精确判定
        run: |
          uv run pytest tests/test_images.py --cov=images --cov-branch --cov-report=term-missing --cov-fail-under=90
          uv run coverage json -o coverage.json
          uv run python scripts/check_image_coverage.py
      - name: Syntax check
        run: uv run python -m compileall -q main.py images.py subagents.py background_jobs.py agent UI memory scripts session.py permissions.py classifier.py compact.py file_history.py mcp_servers.py mentions.py tasks_store.py tests scripts
      - name: Import check
        # compileall 查不出 import 错误（曾漏掉 main.py 从错误模块导入 print_welcome_banner），
        # 用假 key 做 import 级验证——model.py 只要变量非空，import 阶段不发请求
        run: DEEPSEEK_API_KEY=ci-smoke uv run python -c "import main; from agent import agent"
